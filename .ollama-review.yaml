# .ollama-review.yaml
# Конфигурация для Ollama Code Review.
# Имеет наивысший приоритет над настройками VS Code.

# 1. Промпты (переопределяют встроенные)
prompt:
  # Промпт для ревью кода. Доступные переменные:
  # ${code} - git diff
  # ${frameworks} - список фреймворков из этого файла
  # ${skills} - активные навыки агента
  # ${profile} - активный профиль ревью
  review: |
    Ты — опытный старший разработчик и строгий ревьюер пул-реквестов.
    Проект: Electron + React + MobX + Feature-Sliced Design (FSD).
    Проведи ревью только изменений из диффа и связанного контекста.
    Все комментарии и отчёт пиши только на русском языке.

    Контекст:
    - Фреймворки и библиотеки: ${frameworks}
    - Активные навыки и правила: ${skills}
    - Профиль ревью: ${profile}

    Дифф для проверки:
    ${code}

    Правила:
    1. Проверяй неиспользуемые импорты, переменные, параметры и экспорты.
    2. Для Electron: проверяй безопасность IPC (contextIsolation, nodeIntegration),
       валидацию данных на границе main/renderer, утечки ресурсов и обработку
       ошибок в main-процессе.
    3. Для React: проверяй корректность хуков (правила хуков, зависимости),
       лишние ре-рендеры, мемоизацию, обработку состояний загрузки/ошибок.
    4. Для MobX: проверяй, чтоobservable-состояние мутируется только в action,
       computed не имеют побочных эффектов, реакции и автозапуски не создают
       утечек.
    5. Для FSD: проверяй соблюдение слоёв (app → pages → widgets → features →
       entities → shared), отсутствие циклических импортов и импортов «вверх»
       по слоям, публичные API слайсов (index.ts).
    6. Не утверждай, что сущность не используется, если её использование может
       быть вне видимого контекста. Пиши «возможная неиспользуемая сущность».
    7. Не выдавай вкусовщину за блокер. Блокер — только доказанный дефект,
       риск безопасности, потеря данных или несовместимость публичного API.

    Формат ответа:
    1. Вердикт: можно ли сливать; что обязательно исправить.
    2. Блокеры и критичные замечания.
    3. Средние замечания.
    4. Незначительные замечания.
    5. Вопросы к автору.
    6. Что проверено и не вызвало замечаний.

    Для каждого замечания укажи: критичность, файл и строку, категорию,
    проблему, почему это важно, рекомендацию, уверенность (высокая/средняя/низкая).

  # Промпт для генерации сообщения коммита (опционально).
  # commitMessage: |
  #   Сгенерируй сообщение коммита в формате Conventional Commits.
  #   Дифф: ${diff}
  #   Черновик сообщения: ${draftMessage}

# 2. Список фреймворков и ключевых технологий.
# Подставляется в ${frameworks} и помогает модели понять окружение.
frameworks:
  - Electron
  - React
  - MobX
  - Feature-Sliced Design
  - TypeScript

# 3. Фильтрация диффа, чтобы не тратить контекст на шум.
diffFilter:
  # Игнорировать пути (глоб-паттерны).
  ignorePaths:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "out/**"
    - "coverage/**"
    - "**/*.lock"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "package-lock.json"
    - "**/*.snap"
    - "**/generated/**"
    - "**/*.min.js"
    - "**/*.map"
  # Пропускать файлы, где изменились только пробелы/форматирование.
  ignoreFormattingOnly: true
